# Editorial rules. The rule engine runs BEFORE the AI and always wins.
# All times are Europe/Riga local time.

# Editor status handling (set in WordPress):
#   now  -> publish within 5 minutes to all eligible channels, skip the queue
#   must -> must be scheduled within must_max_delay_hours
#   can  -> AI decides whether/when/where
#   dont -> never publish; cancels anything already scheduled
must_max_delay_hours: 6
now_max_delay_minutes: 5
# 'now' items older than this (e.g. a backlog on first ingest) are NOT
# force-published — they go through the normal rules instead.
now_max_age_hours: 6
# Several simultaneous 'now' items get spaced this far apart per channel.
now_burst_gap_minutes: 5

# Freshness: news loses click value fast. Older items are not eligible
# unless the editor marked them evergreen.
max_age_hours:
  news: 12
  sport: 8
  entertainment: 48

# Don't post near-duplicates back to back on the same channel.
similarity_guard:
  window: 3          # compare against the last N posts on the channel
  threshold: 0.70    # 0..1 title/lead similarity

# Feed diversity: within any rolling window of N posts per channel,
# require a mix of sections and formats.
section_mix:
  window: 6
  min_distinct_sections: 2
  min_distinct_formats: 2

# Sensitive content only at night, unless the editor said "now".
time_windows:
  - match: {sensitivity: [nudity, party, alcohol]}
    allow: ["22:00-06:00"]
    unless_status: [now]

# Tone guards applied to generated copy (enforced in code, listed here
# so editors can see them):
#   - no emoji or exclamation marks on tragedy/crime content
#   - no clickbait phrases, no ALL-CAPS words, max one "?" hook
copy_tone:
  no_emoji_sensitivity: [tragedy, crime]

# Vertikāls og attēls FB saites kartītē tiek apgriezts, tāpēc šādiem
# rakstiem link posts automātiski kļūst par photo. Izslēdz (false), ja
# gribi vairāk link postu par spīti apgrieztajiem attēliem.
portrait_link_to_photo: true

# Attēli, kuru URL satur kādu no šiem fragmentiem, jau ir gatavas grafikas
# ar iestrādātu virsrakstu (photopost) — tiem plāksni NELIEK pa virsu:
# foto posts iet ārā ar oriģinālu, story dabū tikai CTA joslu bez virsraksta.
prebranded_image_patterns: ["photopost"]

# Photo posts get the article image with the tv3.lv title plate burned in
# (white box + red accent, same style as the site's share images).
photo_title_overlay: true

# Ja izvēlētais attēls ir vertikāls (parasti photopost grafika ar jau
# iestrādātu virsrakstu), bet rakstam feed'ā ir arī horizontāls foto,
# photo postam / karuseļa vākam izmanto horizontālo — virsraksta plāksne
# tad gulstas uz tīra foto, nevis dubulto tekstu.
photo_prefer_landscape: true

# SocialFlow-style tactic: on Facebook image posts (photo/album/carousel)
# the article link is posted automatically as the FIRST COMMENT, keeping
# the caption clean — better reach, link still one tap away.
link_in_first_comment: true

# Saite paliek ARĪ aprakstā (ne tikai komentārā): lasītājam viens pieskāriens
# abos gadījumos, un apraksts ar mērķa saiti ir tas, kas foto ierakstam dod
# klikšķināmu galamērķi arī maksas reklāmā. Instagram to izlaiž pats — tur
# apraksta saites nav klikšķināmas. false = vecā "tīrā apraksta" taktika.
link_in_caption: true

# Instagram apraksta saites nav klikšķināmas, tāpēc tur saite ir TIKAI
# pirmajā komentārā — un lasītājam tas jāpasaka: šī rinda tiek pielikta
# apraksta beigās (traģēdijās/noziegumos bez emocijzīmes). Tukšs = bez
# norādes.
ig_link_pointer: "Saite komentāros 👇"

# X un Threads: saite tekstā ir klikšķināma, un tas ir noklusējums — viens
# pieskāriens līdz portālam. true = «saite atbildē» taktika: tvīts/ieraksts
# bez saites, saite pirmajā atbildē (sasniedzamībai labāk, klikšķiem parasti
# sliktāk; utm to izmēra). Attiecas tikai uz mediju ierakstiem (photo,
# galerija, lente) — saites ierakstam saite ir pati kartīte.
x_link_in_reply: false
threads_link_in_reply: false
# Norāde apraksta beigās, kad saite ir atbildē (tikai ja kāds no augšējiem
# ir true).
reply_link_pointer: "Saite atbildē 👇"

# Lente un kartīšu galerija ir raksta, ne kanāla grafika: ja Facebook
# kanālam tā jau uzbūvēta, Instagram/Threads/X to pārizmanto (tas pats
# fails, tā pati ieruna). false = katrs kanāls renderē savu.
share_built_media: true

# Apzinātā dublēšana (channels.yaml repost_after_minutes): otro ierakstu
# dabū tikai raksti ar vismaz šādu AI vērtējumu — lai dublējas spēcīgākais
# saturs, nevis viss.
repost_min_score: 0.75

# Īsā, zīmolotā saite ierakstu tekstā: pilnā saite ar UTM birkām aizņem
# trīs rindas un izskatās tehniska, tāpēc lasītājam rādām
# https://tv3.lv/r/<kods>, kas ar 302 aizved uz to pašu adresi ar tām pašām
# UTM birkām (GA4 attiecinājums nemainās) un ļauj mums skaitīt īstos
# klikšķus — Facebook foto ierakstiem un Instagram tādu metriku nedod.
# Tukša vērtība = izslēgts (iet pilnā saite). Lai ieslēgtu, tv3.lv pusē
# vajag vienu CDN/nginx noteikumu: tv3.lv/r/* -> šīs lietotnes /r/*.
short_link_base: ""

# CMS metadati no raksta lapas: katrs tv3.lv raksts dataLayer'ā nes savu
# Post ID, autoru, redakcijas tagus, ierakstu tipu (video/galerija), apjomu
# un zīmolu ("Tikai tv3.lv"). Feed'ā tā nav, tāpēc lapu ievelkam vienu reizi
# uz rakstu un nokešojam. false = izslēgts (viss strādā kā līdz šim, tikai
# bez šiem signāliem).
page_meta: true

# TV3 Play (play.tv3.lv) promo — seriāli, filmas, raidījumi no Play
# sitemapiem (docs/play-strategy.md). IZSLĒGTS pēc noklusējuma: ieslēdz
# enabled: true, kad esi gatavs. Ētikas sargi: nekad blakus traģēdijai vai
# noziegumam, drūmas dienas režīms, vakara logs, viena nosaukuma atkārtojums
# ne biežāk kā reizi 14 dienās, ne vairāk kā desmitā daļa plūsmas.
play:
  enabled: false
  sitemaps: ["/sitemaps/sitemap-latest.xml", "/sitemaps/sitemap-{month}.xml"]
  exclude_slugs: [tv3-zinas, tv3-zinas-isuma, degpunkta, 900-sekundes, bez-tabu, neka-personiga, tiesraides]
  min_seconds: 300
  daily_cap: 1
  weekend_daily_cap: 2
  story_daily_cap: 1
  feed_share: 0.10
  windows: ["19:00-22:30"]
  adult_window: "21:00-23:59"
  adjacency_minutes: 90
  somber:
    window_hours: 6
    threshold: 0.4
    allowed_genres: [ģimenes, komēdija, drāma, dokumentāl, kulinār, ceļojum, daba, bērn]
  title_cooldown_days: 14
  genre_overrides: {}        # piem. {klarksona-ferma: [dokumentāls, humors]}
  # P2: izlašu karuselis (pk/se/sv vakarā, redaktors apstiprina) un tilti no
  # rakstiem par raidījumu/personu (tikai izklaide/sports, tikai bez traģēdijas)
  selection_channel: fb_tv3lv
  selection_days: [4, 5, 6]
  selection_hour: 19
  selection_requires_approval: true
  bridges: true
  bridge_sections: [entertainment, sport]
  bridge_cooldown_days: 3
  # P3: reklāmā tikai organiski strādājoši Play ieraksti; budžeta daļu
  # (ads:play_share, 15 %) maina Reklāmu lapā vai iestatījumos
  boost_min_impressions: 1000
  boost_min_clicks: 10

# tv3.lv/video arhīvs — portāla vertikālie klipi (iekšējais «TikTok»).
# Raksts ar piesaistītu klipu: lente/stāsts top no īstā video, saite ved uz
# konkrēto video lapu tv3.lv/video/<id>/ (link_reels_to_video). Klips bez
# raksta: kļūst par savu rindu (formāts tikai reel/story), iet cauri AI
# lēmumam, bet ziņu vietu neaizņem — garš pusperiods, savs dienas limits.
# Zonde: Diagnostika -> «tv3.lv/video arhīvs» -> «Zonde».
video_archive:
  enabled: true
  listing: "https://tv3.lv/video/"     # arhīva lapa (JS čaula; tikai rezerve)
  feed: "https://tv3.lv/api/1/video/feed/"   # klipu API: items[{id,title,image,video_url(m3u8),duration_ms,related_url,created_at,content_source}]
  feed_pages: 2                        # lapas pa 20 klipiem katrā apgājienā (?page=N)
  player_api: "https://tv3.lv/api/5/tv3/video/{id}"   # rezerve straumei, ja feed to nedod
  source_sections:                     # content_source.name -> sadaļa, ja related_url nedod
    Bez Tabu: entertainment
    900 sekundes: news
  interval_minutes: 30
  max_new_per_run: 6
  min_seconds: 5
  max_seconds: 180
  daily_cap: 3                         # klipi bez raksta uz kanālu dienā
  half_life_hours: 48                  # rindas prioritātē klips noveco lēni
  max_age_hours: 72                    # vecāku klipu vairs nepublicē
  link_reels_to_video: true            # arī raksta lente/stāsts ved uz video lapu
  section_default: entertainment
  category_sections:                   # dlEvent kategorija -> mūsu sadaļa
    Ziņas: news
    Sports: sport
    Izklaide: entertainment

# tv3.lv pašu īsā saite (tv3.lv/p/<Post ID>) ierakstu tekstā, kad mūsu
# /r/ kods nav ieslēgts. Tā strādā jau šodien, bez nginx noteikuma, un ir
# īsa; toties klikšķus neskaita, un UTM birkas paliek tikai tad, ja novirze
# vaicājuma virkni saglabā. Tāpēc noklusēti izslēgta: ieslēdz pēc tam, kad
# reize ir pārbaudīta ar roku (raksta skatā ir poga ar gatavo saiti).
cms_short_links: false

# Reelu ieruna (voice-over). AI uzraksta ierunas tekstu no raksta, Azure
# Speech to nolasa ar latviešu neironu balsi. Bez Azure atslēgas (Konti
# sadaļā) reels iznāk kluss — teksts tik un tā glabājas receptē un ir
# redzams priekšskatījumā. false = pat ar atslēgu neizmantot.
reel_voice: true
# Stāstos likt jau uzbūvēto raksta lenti, nevis statisku attēlu. Stāsts un
# reels ir viens un tas pats 9:16 formāts, tāpēc otrreiz renderēt nav jēgas,
# un tieši stāstos ieruna nostrādā vislabāk: stāstus skatās ar skaņu, plūsmā
# lentes bieži sākas klusas. false = stāstos paliek attēls.
story_reuses_reel: true
# Balss pakalpojums: azure vai elevenlabs (katram sava atslēga Konti sadaļā;
# pārslēdzoties atslēgas paliek, mainās tikai tas, kurš runā). Trešais
# kandidāts ir tilde (tilde.ai) — latviešu balsis ar pielāgojamām izrunas
# vārdnīcām; tā cena un API nāk caur sarunu ar pārdošanu, tāpēc adapters
# vēl nav uzrakstīts.
tts_provider: azure
# azure: female (lv-LV-EveritaNeural) vai male (lv-LV-NilsNeural), vai pilns
# balss nosaukums. elevenlabs: female/male (priekšdefinētās Rachel/Adam) vai
# balss ID no Voice Library — latviešu balsij ņem ID no bibliotēkas.
reel_voice_name: female

# Balss PA SADAĻĀM. Izklaides ziņas panes citu balsi nekā tā, ar kuru stāsta
# par pierobežu — tā ir redakcijas izvēle. Sadaļas, kas te nav uzskaitītas,
# lieto reel_voice_name. Vērtība ir tā pati, kas tur: female/male vai ID.
# Nākamā rinda ir PIEMĒRS un ir izslēgta: lai to ieslēgtu, noņem tikai `#`,
# abas atkāpes atstāj. Kamēr tā ir komentārs, neviena sadaļa savu balsi
# nedabū — arī tad, ja rindā ir pareizs ID.
reel_voice_by_section:
#  entertainment: male

# Runas temps procentos pret pakalpojuma noklusējumu. -4 ir nedaudz lēnāk,
# jo lentē skatītājs vienlaikus lasa arī kadra tekstu. Azure to saņem kā
# SSML prosody rate, ElevenLabs — kā speed reizinātāju (tas tiek sūtīts
# TIKAI tad, kad temps ir mainīts, jo vecāki modeļi lauku nepieņem).
# Diapazons -40..+40; ElevenLabs praksē griež pie -30..+20.
reel_voice_rate: -4

# Temps pa sadaļām — tas pats sadaļas jautājums, kas balss. Piemērs tāpat
# ir izslēgts: noņem `#`, atkāpi atstāj.
reel_voice_rate_by_section:
#  entertainment: 8

# Cik rakstzīmju no nodaļas teksta balss nolasa lentē (griež pie teikuma
# robežas; pirmais teikums paliek vienmēr). ElevenLabs rēķina par
# rakstzīmi, un 45 s teaserim pietiek ar nodaļas kodolu — pilnais teksts
# paliek karuseļa kartītē un rakstā.
reel_chapter_voice_chars: 220

# ElevenLabs modelis. Latviski runā tikai eleven_v3; multilingual_v2
# latviešu valodas sarakstā nav.
elevenlabs_model: eleven_v3
# Izrunas vārdnīca ierunai. Latviski punkts aiz cipara nozīmē kārtas
# skaitli, tāpēc balss «tv3.lv» pati nolasa kā «tv trešais punkts lv».
# Šeit pasakām, kā to izrunāt pareizi; papildini, kad kāds vārds skan greizi
# (rakstības forma ierakstā nemainās — mainās tikai izruna).
tts_pronunciation:
  "tv3.lv": "tv trīs punkts lv"
  "tv3 play": "tv trīs pleij"
  "tv3": "tv trīs"

# Plānošanas režīms:
#   asap     -> ziņu portāla režīms (noklusējums): publicē, tiklīdz gatavs —
#               pirmais derīgais laiks uzvar, daudzveidības sargs nekad
#               neaizkavē saturu (formātu miksu nodrošina formāta izvēle).
#   optimize -> velk postus uz izmērītajām stiprajām stundām un piemēro
#               daudzveidības sargu slotu līmenī. Ieslēdz, kad GA4 dati
#               parādīs, ka laika optimizācija tiešām dod vairāk sesiju.
scheduling_mode: asap

# Dienas limits (channels.yaml daily_cap) ir mīksts: saturs ar AI score
# >= min_score drīkst to pārsniegt līdz max_factor reizēm. Īstā aizsardzība
# pret plūsmas pārpludināšanu paliek min_gap_minutes.
daily_cap_flex:
  min_score: 0.75
  max_factor: 1.5

# Learning thresholds: how many measured posts are needed before the
# system replaces default assumptions with measured behaviour.
priors:
  min_posts_hours: 30    # posts before the measured hour curve takes over
  min_posts_format: 8    # posts per format before its weight is adjusted

# Term-ID blocklist per channel (article never goes to that channel).
# Piemērs izslēgts: noņem `#`, atkāpi atstāj.
term_blocklist:
#  fb_tv3lv: [12345]

# Term-ID allowlist per channel (if set, ONLY these terms go there)
term_allowlist:
#  fb_tv3lv: [12345]

# --- ES MI akta atruna -------------------------------------------------
# Regulas (ES) 2024/1689 50. pants prasa marķēt mākslīgi ģenerētu saturu un
# atklāt to arī tad, kad runa ir par sabiedrībai nozīmīgiem jautājumiem —
# ziņas ir tieši tas. Parakstu, birkas, kartīšu tekstus un lentes ierunu
# raksta MI, tāpēc marķējums ir uz katras grafikas, katrā parakstā un
# izrunāts lentes beigās.
# Izslēgt to ir redakcijas atbildība, ne tehnisks slēdzis — noklusējums true.
ai_disclosure: true
ai_disclosure_text: "Saturs sagatavots ar mākslīgā intelekta palīdzību"
# X ir 280 zīmes, tur ejot pilnā formulējumā, teksts paliktu bez satura
ai_disclosure_short: "Veidots ar MI"
# Ko balss pasaka lentes beigās. Tukšs (noklusējums) = neko: marķējums ir
# redzams uz kadra, pilnā tekstā noslēguma kadrā un parakstā, bet izrunāts
# tas nāca kā liekais teikums aiz aicinājuma. Ieraksti teikumu, ja gribi arī
# skaļi.
ai_disclosure_spoken: ""

# Cik lielu daļu no attēla augstuma Facebook saites kartīte drīkst nogriezt,
# pirms ierakstu pārslēdzam uz photo. Kartītes rāmis ir 1.91:1, un šaurāku
# attēlu tā griež pa vertikāli: 16:9 zaudē 7%, 3:2 — 21%, 4:3 — 30%,
# kvadrāts — 48%. Ziņu kadrā galvas ir augšējā trešdaļā, tāpēc tieši tās
# pazūd pirmās. Photo ierakstā attēlu zīmējam mēs, un mūsu rāmji griež sānus,
# nevis augšu — galvas paliek veselas, bet saites kartīte pazūd (saite aiziet
# pirmajā komentārā un aprakstā). 1.0 = nekad nepārslēgt; 0.0 = vienmēr, kad
# kartīte vispār kaut ko griež.
# 0.30: 3:2 foto (21 %) ir Facebook norma, ne sabojāta kartīte — pie 0.20
# gandrīz katrs saites ieraksts kļuva par foto un saites plūsmā pazuda.
link_card_max_crop: 0.30

# Kad saites kartīte ir sabojāta NEATKARĪGI no formātu kvotas: vertikāls
# attēls vai vairāk nekā šī daļa nogriezta augstuma. Zem šīs robežas
# `format_mix` saites grīda ir svarīgāka un ierakstu atstāj kā saiti; virs tās
# grīda vairs neaiztur, jo šāds saites ieraksts kvotu tik un tā nepilda — tas
# tikai izskatās slikti un iemāca svariem, ka saites posti nestrādā.
link_card_force_crop: 0.40

# Facebook saites kartītei sūtām SAVU attēlu (`picture`): tas pats foto,
# iegriezts 1.91:1 un piesiets augšai — attēls kartītē it kā nobīdās zemāk,
# un galvas paliek kadrā. Facebook to pieņem tikai tad, ja tv3.lv domēns ir
# verificēts Meta Business Manager (Brand Safety → Domains); ja noraida,
# ieraksts aiziet ar Facebook griezumu un Konti lapa parāda, kas jāizdara.
# Kad attēls tiek pieņemts, saites ieraksti vairs netiek pārslēgti uz photo.
link_card_custom_picture: true

# Kur MI marķējumu likt. voiced_reels (noklusējums) = tikai lentēs, kurās
# tiešām skan sintezēta balss — tā ir vienīgā daļa, kas ir mākslīgi ģenerēts
# medijs. Rakstu raksta žurnālists, un atruna zem katra ieraksta lasās kā
# apgalvojums, ka MI ir uzrakstījis RAKSTU. all = marķējums uz visiem
# formātiem (plašākā interpretācija; tā bija sākotnēji).
ai_disclosure_scope: voiced_reels

# --- Kadence: ziņas iet ārā svaigas -----------------------------------
# Fiksēta atstarpe (channels.yaml min_gap_minutes) sargā tukšu rindu no
# pārplūdes, bet vakara ziņu vilnī tā ziņas sarindo līdz nākamajam rītam.
# Tāpēc atstarpe saraujas, kad rinda aug: mērķis ir rindu iztukšot šajā
# laikā (ne šaurāk par kanāla min_gap_floor_minutes).
backlog_horizon_hours: 2

# Cik ātri sadaļas ziņa zaudē vērtību (pusperiods stundās): pēc katra
# pusperioda vērtība dalās uz pusi. Pēc tā rindu kārto pārplānotājs —
# svaigs sporta rezultāts iet pirms vakardienas skaidrojuma.
section_half_life_hours:
  news: 4
  sport: 2
  entertainment: 24

# Kas drīkst iziet klusajās stundās: sporta rezultāts pēc vakara mača un
# ļoti spēcīga ziņa (AI vērtējums >= min_score), ja raksts nav vecāks par
# max_age_hours — rīt no rīta abi būtu vakardiena. Tukšs ({}) = neviens.
quiet_hours_exempt:
  min_score: 0.85
  sections: [sport]
  max_age_hours: 2

# Pēc katra lēmumu viļņa kanāla rindu pārkārtot pēc vērtības un svaiguma
# (ne ienākšanas kārtas) un atcelt to, kas līdz savam slotam būs par vecu.
# Rokas darbu, franšīzes un «now» ierakstus pārplānošana neaiztiek.
replan_queue: true

# Vai izmērītie MAKSAS rezultāti drīkst ietekmēt organisko formāta izvēli.
# Boostot var visus trīs formātus; kurš par eiro atved vairāk sesiju, rāda
# reklāmu ieraksti. Reizinātājs stājas spēkā tikai režīmā approve/auto, tikai
# ar vismaz 3 reklāmām formātā, un koriģē ne vairāk par ±20 %.
ads_inform_format: true

# Vai tieši pirms publicēšanas atcelt ierakstu, kura raksts pa gaidīšanas
# laiku ir kļuvis vecāks par max_age_hours. Ieraksts rindā var nostāvēt
# stundas, un vakardienas ziņa šodienas stāstā ir sliktāka par neko.
# false = publicē arī novecojušo (tikai plānošana ievēro svaigumu).
stale_publish_guard: true
