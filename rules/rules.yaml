# Editorial rules. The rule engine runs BEFORE the AI and always wins.
# All times are Europe/Riga local time.

# Editor status handling (set in WordPress):
#   now  -> publish within 5 minutes to all eligible channels, skip the queue
#   must -> must be scheduled within must_max_delay_hours
#   can  -> AI decides whether/when/where
#   dont -> never publish; cancels anything already scheduled
must_max_delay_hours: 6
now_max_delay_minutes: 5
# 'now' items older than this (e.g. a backlog on first ingest) are NOT
# force-published — they go through the normal rules instead.
now_max_age_hours: 6
# Several simultaneous 'now' items get spaced this far apart per channel.
now_burst_gap_minutes: 5

# Freshness: news loses click value fast. Older items are not eligible
# unless the editor marked them evergreen.
max_age_hours:
  news: 12
  sport: 8
  entertainment: 48

# Don't post near-duplicates back to back on the same channel.
similarity_guard:
  window: 3          # compare against the last N posts on the channel
  threshold: 0.70    # 0..1 title/lead similarity

# Feed diversity: within any rolling window of N posts per channel,
# require a mix of sections and formats.
section_mix:
  window: 6
  min_distinct_sections: 2
  min_distinct_formats: 2

# Sensitive content only at night, unless the editor said "now".
time_windows:
  - match: {sensitivity: [nudity, party, alcohol]}
    allow: ["22:00-06:00"]
    unless_status: [now]

# Tone guards applied to generated copy (enforced in code, listed here
# so editors can see them):
#   - no emoji or exclamation marks on tragedy/crime content
#   - no clickbait phrases, no ALL-CAPS words, max one "?" hook
copy_tone:
  no_emoji_sensitivity: [tragedy, crime]

# Vertikāls og attēls FB saites kartītē tiek apgriezts, tāpēc šādiem
# rakstiem link posts automātiski kļūst par photo. Izslēdz (false), ja
# gribi vairāk link postu par spīti apgrieztajiem attēliem.
portrait_link_to_photo: true

# Attēli, kuru URL satur kādu no šiem fragmentiem, jau ir gatavas grafikas
# ar iestrādātu virsrakstu (photopost) — tiem plāksni NELIEK pa virsu:
# foto posts iet ārā ar oriģinālu, story dabū tikai CTA joslu bez virsraksta.
prebranded_image_patterns: ["photopost"]

# Photo posts get the article image with the tv3.lv title plate burned in
# (white box + red accent, same style as the site's share images).
photo_title_overlay: true

# Ja izvēlētais attēls ir vertikāls (parasti photopost grafika ar jau
# iestrādātu virsrakstu), bet rakstam feed'ā ir arī horizontāls foto,
# photo postam / karuseļa vākam izmanto horizontālo — virsraksta plāksne
# tad gulstas uz tīra foto, nevis dubulto tekstu.
photo_prefer_landscape: true

# SocialFlow-style tactic: on Facebook image posts (photo/album/carousel)
# the article link is posted automatically as the FIRST COMMENT, keeping
# the caption clean — better reach, link still one tap away.
link_in_first_comment: true

# Saite paliek ARĪ aprakstā (ne tikai komentārā): lasītājam viens pieskāriens
# abos gadījumos, un tikai apraksts ar mērķa saiti ir tas, ko Facebook var
# pastiprināt kā maksas traffic reklāmu. Instagram to izlaiž pats — tur
# apraksta saites nav klikšķināmas. false = vecā "tīrā apraksta" taktika.
link_in_caption: true

# Apzinātā dublēšana (channels.yaml repost_after_minutes): otro ierakstu
# dabū tikai raksti ar vismaz šādu AI vērtējumu — lai dublējas spēcīgākais
# saturs, nevis viss.
repost_min_score: 0.75

# Īsā, zīmolotā saite ierakstu tekstā: pilnā saite ar UTM birkām aizņem
# trīs rindas un izskatās tehniska, tāpēc lasītājam rādām
# https://tv3.lv/r/<kods>, kas ar 302 aizved uz to pašu adresi ar tām pašām
# UTM birkām (GA4 attiecinājums nemainās) un ļauj mums skaitīt īstos
# klikšķus — Facebook foto ierakstiem un Instagram tādu metriku nedod.
# Tukša vērtība = izslēgts (iet pilnā saite). Lai ieslēgtu, tv3.lv pusē
# vajag vienu CDN/nginx noteikumu: tv3.lv/r/* -> šīs lietotnes /r/*.
short_link_base: ""

# CMS metadati no raksta lapas: katrs tv3.lv raksts dataLayer'ā nes savu
# Post ID, autoru, redakcijas tagus, ierakstu tipu (video/galerija), apjomu
# un zīmolu ("Tikai tv3.lv"). Feed'ā tā nav, tāpēc lapu ievelkam vienu reizi
# uz rakstu un nokešojam. false = izslēgts (viss strādā kā līdz šim, tikai
# bez šiem signāliem).
page_meta: true

# tv3.lv pašu īsā saite (tv3.lv/p/<Post ID>) ierakstu tekstā, kad mūsu
# /r/ kods nav ieslēgts. Tā strādā jau šodien, bez nginx noteikuma, un ir
# īsa; toties klikšķus neskaita, un UTM birkas paliek tikai tad, ja novirze
# vaicājuma virkni saglabā. Tāpēc noklusēti izslēgta: ieslēdz pēc tam, kad
# reize ir pārbaudīta ar roku (raksta skatā ir poga ar gatavo saiti).
cms_short_links: false

# Reelu ieruna (voice-over). AI uzraksta ierunas tekstu no raksta, Azure
# Speech to nolasa ar latviešu neironu balsi. Bez Azure atslēgas (Konti
# sadaļā) reels iznāk kluss — teksts tik un tā glabājas receptē un ir
# redzams priekšskatījumā. false = pat ar atslēgu neizmantot.
reel_voice: true
# Stāstos likt jau uzbūvēto raksta lenti, nevis statisku attēlu. Stāsts un
# reels ir viens un tas pats 9:16 formāts, tāpēc otrreiz renderēt nav jēgas,
# un tieši stāstos ieruna nostrādā vislabāk: stāstus skatās ar skaņu, plūsmā
# lentes bieži sākas klusas. false = stāstos paliek attēls.
story_reuses_reel: true
# Balss pakalpojums. Ieviests: azure (Azure Speech, atslēga Konti sadaļā).
# Otrs kandidāts ir tilde (tilde.ai) — latviešu balsis ar pielāgojamām
# izrunas vārdnīcām, kas īpašvārdus lokatīvā izrunā pareizāk; tā cena un
# API nāk caur sarunu ar pārdošanu, tāpēc adapters vēl nav uzrakstīts.
tts_provider: azure
# female (lv-LV-EveritaNeural) vai male (lv-LV-NilsNeural); var ierakstīt
# arī pilnu balss nosaukumu.
reel_voice_name: female
# Izrunas vārdnīca ierunai. Latviski punkts aiz cipara nozīmē kārtas
# skaitli, tāpēc balss «tv3.lv» pati nolasa kā «tv trešais punkts lv».
# Šeit pasakām, kā to izrunāt pareizi; papildini, kad kāds vārds skan greizi
# (rakstības forma ierakstā nemainās — mainās tikai izruna).
tts_pronunciation:
  "tv3.lv": "tv trīs punkts lv"
  "tv3 play": "tv trīs pleij"
  "tv3": "tv trīs"

# Plānošanas režīms:
#   asap     -> ziņu portāla režīms (noklusējums): publicē, tiklīdz gatavs —
#               pirmais derīgais laiks uzvar, daudzveidības sargs nekad
#               neaizkavē saturu (formātu miksu nodrošina formāta izvēle).
#   optimize -> velk postus uz izmērītajām stiprajām stundām un piemēro
#               daudzveidības sargu slotu līmenī. Ieslēdz, kad GA4 dati
#               parādīs, ka laika optimizācija tiešām dod vairāk sesiju.
scheduling_mode: asap

# Dienas limits (channels.yaml daily_cap) ir mīksts: saturs ar AI score
# >= min_score drīkst to pārsniegt līdz max_factor reizēm. Īstā aizsardzība
# pret plūsmas pārpludināšanu paliek min_gap_minutes.
daily_cap_flex:
  min_score: 0.75
  max_factor: 1.5

# Learning thresholds: how many measured posts are needed before the
# system replaces default assumptions with measured behaviour.
priors:
  min_posts_hours: 30    # posts before the measured hour curve takes over
  min_posts_format: 8    # posts per format before its weight is adjusted

# Term-ID blocklist per channel (article never goes to that channel)
term_blocklist: {}
#  fb_tv3lv: [12345]

# Term-ID allowlist per channel (if set, ONLY these terms go there)
term_allowlist: {}

# --- ES MI akta atruna -------------------------------------------------
# Regulas (ES) 2024/1689 50. pants prasa marķēt mākslīgi ģenerētu saturu un
# atklāt to arī tad, kad runa ir par sabiedrībai nozīmīgiem jautājumiem —
# ziņas ir tieši tas. Parakstu, birkas, kartīšu tekstus un lentes ierunu
# raksta MI, tāpēc marķējums ir uz katras grafikas, katrā parakstā un
# izrunāts lentes beigās.
# Izslēgt to ir redakcijas atbildība, ne tehnisks slēdzis — noklusējums true.
ai_disclosure: true
ai_disclosure_text: "Saturs sagatavots ar mākslīgā intelekta palīdzību"
# X ir 280 zīmes, tur ejot pilnā formulējumā, teksts paliktu bez satura
ai_disclosure_short: "Veidots ar MI"
# Ko balss pasaka lentes beigās. Tukšs (noklusējums) = neko: marķējums ir
# redzams uz kadra, pilnā tekstā noslēguma kadrā un parakstā, bet izrunāts
# tas nāca kā liekais teikums aiz aicinājuma. Ieraksti teikumu, ja gribi arī
# skaļi.
ai_disclosure_spoken: ""

# Cik lielu daļu no attēla augstuma Facebook saites kartīte drīkst nogriezt,
# pirms ierakstu pārslēdzam uz photo. Kartītes rāmis ir 1.91:1, un šaurāku
# attēlu tā griež pa vertikāli: 16:9 zaudē 7%, 3:2 — 21%, 4:3 — 30%,
# kvadrāts — 48%. Ziņu kadrā galvas ir augšējā trešdaļā, tāpēc tieši tās
# pazūd pirmās. Photo ierakstā attēlu zīmējam mēs, un mūsu rāmji griež sānus,
# nevis augšu — galvas paliek veselas, bet saites kartīte pazūd (saite aiziet
# pirmajā komentārā un aprakstā). 1.0 = nekad nepārslēgt; 0.0 = vienmēr, kad
# kartīte vispār kaut ko griež.
link_card_max_crop: 0.20
