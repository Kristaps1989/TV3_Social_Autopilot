# Channel configuration. Everything here is editable without a deploy.
# Cadence values follow social best practice: don't flood the feed,
# keep a minimum gap between posts, respect night-time quiet hours.
#
# PIEZĪME par `feeds:` un `click_weight:`: kods tos NELASA. Plūsmas tiek
# aptaujātas visas, kas feeds.yaml ir active: true, un maršrutēšanu uz kanālu
# nosaka `sections:`. Šeit tie palikuši kā redakcijas piezīme par nodomu —
# formātu nosaukumus tur nelikt, tiem ir `formats:` (saglabājot to tagad
# noķer arī pārbaude).

fb_tv3lv:
  platform: facebook_page
  display_name: "Facebook — tv3.lv"
  feeds: [news_all, entertainment_all, photo_posts]
  min_gap_minutes: 45        # FB punishes rapid-fire posting; 45 min keeps reach healthy
  daily_cap: 0               # 0 = bez dienas limita; atstarpe ir īstā aizsardzība
  quiet_hours: ["01:00-06:00"]
  # Sections this channel accepts (empty = all)
  sections: []
  # card_carousel = branded card gallery (cover + highlights + CTA card),
  # used by the AI for explainers/list stories; needs the AI key active.
  # reel = 10-15 s slideshow video (vāks + punkti + CTA kadrs); arī AI izvēle.
  formats: [link, photo, photo_album, card_carousel, reel]
  # Starting weight for the pageview KPI, replaced by measured data after ~2 weeks
  click_weight: 1.0
  # Relative preference per format for THIS channel. Photo posts win on
  # engagement, but our KPI is klikšķi uz tv3.lv, and there the link post
  # leads — tāpēc link sāk nedaudz priekšā; measured data (priors.py) šo
  # pārraksta, tiklīdz abiem formātiem ir pietiekami daudz ierakstu.
  format_weights: {link: 1.1, photo: 1.0, photo_album: 0.9, text_only: 0.4}
  # Minimālā formāta daļa pēdējos 6 ierakstos. Bez šī grīdas noteikuma
  # viens formāts paņem visu plūsmu (bija 99% photo): tas uzvar katrā
  # neizšķirtā, un tad tas ir vienīgais, par kuru mums vispār ir dati.
  # Link posts ir arī vienīgais ieraksta veids, ko Facebook var pastiprināt
  # kā traffic reklāmu (mērķa saite un CTA poga ir pašā ierakstā).
  format_mix: {link: 0.4}
  # Dienas griesti «bagātajiem» formātiem, ko piedāvā AI. Tā katru rakstu
  # redz atrauti un dienas kopsummu saskaitīt nevar; bez griestiem karuselis
  # bija 6 no 8 ierakstiem. Pārsniedzot kvotu, ieraksts iet kā saite/foto,
  # un iemesls ir redzams lapā «Kāpēc». Rokas «Uztaisīt» kvotu neskata.
  format_daily_cap: {card_carousel: 2, reel: 2}
  # Apzinātā dublēšana: spēcīgākajiem rakstiem AI drīkst pieteikt OTRU
  # ierakstu šajā pašā kanālā citā formātā (foto tagad, saites posts pēc
  # stundas). 0 = izslēgts. Slieksni nosaka rules.yaml repost_min_score.
  repost_after_minutes: 60

fb_stories:
  platform: facebook_page
  display_name: "Facebook Stories — tv3.lv"
  feeds: [news_all, entertainment_all]
  min_gap_minutes: 120       # stories are a garnish, not a second feed
  daily_cap: 6               # kopējais drošības griests
  daily_cap_per_section: 2   # ne vairāk kā 2 stāsti dienā no katras sadaļas
  quiet_hours: ["00:00-07:00"]
  sections: []
  formats: [story]           # vertical branded image, published as a Page story
  click_weight: 0.3          # no tappable link via API -> reach/brand play

x_tv3zinas:
  platform: x
  display_name: "X — TV3 Ziņas"
  feeds: [news_all, sport_all]
  min_gap_minutes: 15        # X tolerates higher frequency
  daily_cap: 0               # bez dienas limita
  quiet_hours: ["01:00-06:00"]
  sections: []
  # X link cards no longer show the headline -> photo (branded title
  # image) + link in text is the strongest format for visual stories.
  # reel = tā pati ierunātā lente, kas Facebook/Instagram (video X ceļ
  # augstāk par visu); card_carousel = tvīts ar 4 attēliem (vāks + pirmās
  # nodaļas). Abus piedāvā tikai AI, grafika top vienu reizi visiem kanāliem.
  formats: [link, photo, text_only, card_carousel, reel]
  format_weights: {link: 1.0, photo: 1.0, text_only: 0.5}
  # Saite paliek tvītā (klikšķināma, viens pieskāriens). «Saite atbildē»
  # taktiku ieslēdz rules.yaml x_link_in_reply — tad tvīts ir bez saites un
  # tā iet pirmajā atbildē; sasniedzamībai labāk, klikšķiem parasti sliktāk.
  click_weight: 0.7

ig_tv3lv:
  platform: instagram
  display_name: "Instagram — tv3.lv"
  # Ieslēdz (active: true), kad Konti sadaļā ir sasaistīts Instagram konts
  # un Login konfigurācijā ir instagram_basic + instagram_content_publish.
  active: false
  feeds: [news_all, entertainment_all, photo_posts]
  min_gap_minutes: 90        # IG soda pārlieku biežu postēšanu vairāk nekā FB
  daily_cap: 8
  quiet_hours: ["00:00-07:00"]
  sections: []
  # IG nav link/teksta postu: brendēts foto, karuselis (card gallery tur ir
  # visdabiskākais formāts), lente (reel — vislielākā sasniedzamība ārpus
  # sekotājiem) un story (video stāsts pārizmanto lenti). Saite vienmēr
  # pirmajā komentārā, apraksta beigās norāde «Saite komentāros»
  # (rules.yaml ig_link_pointer). reel un card_carousel piedāvā AI; grafika
  # ir tā pati, ko uzbūvē Facebook kanālam — otrreiz to nerenderē.
  formats: [photo, photo_album, card_carousel, reel, story]
  format_weights: {photo: 1.0, photo_album: 1.0, story: 0.6}
  click_weight: 0.5

threads_sport:
  platform: threads
  display_name: "Threads — Sports"
  feeds: [sport_all]
  min_gap_minutes: 30
  daily_cap: 0               # bez dienas limita
  quiet_hours: ["00:00-07:00"]
  sections: [sport]
  # photo posts carry the branded title image (same as FB/X); reel un
  # card_carousel — tā pati lente/galerija, ko uzbūvē Facebook kanālam
  # (Threads API prot VIDEO un CAROUSEL); photo_album = raksta galerija
  # karuselī, ja rakstā ≥ 4 attēli. Saite mediju ierakstos paliek tekstā
  # (klikšķināma); rules.yaml threads_link_in_reply liek to atbildē.
  formats: [link, photo, text_only, photo_album, card_carousel, reel]
  format_weights: {link: 1.0, photo: 0.9, text_only: 0.7, photo_album: 0.6}
  click_weight: 0.6
