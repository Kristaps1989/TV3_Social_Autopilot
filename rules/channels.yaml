# Channel configuration. Everything here is editable without a deploy.
# Cadence values follow social best practice: don't flood the feed,
# keep a minimum gap between posts, respect night-time quiet hours.

fb_tv3lv:
  platform: facebook_page
  display_name: "Facebook — tv3.lv"
  feeds: [news_all, entertainment_all, photo_posts]
  min_gap_minutes: 45        # FB punishes rapid-fire posting; 45 min keeps reach healthy
  daily_cap: 24
  quiet_hours: ["01:00-06:00"]
  # Sections this channel accepts (empty = all)
  sections: []
  formats: [link, photo, photo_album]
  # Starting weight for the pageview KPI, replaced by measured data after ~2 weeks
  click_weight: 1.0

x_tv3zinas:
  platform: x
  display_name: "X — TV3 Ziņas"
  feeds: [news_all, sport_all]
  min_gap_minutes: 15        # X tolerates higher frequency
  daily_cap: 40
  quiet_hours: ["01:00-06:00"]
  sections: []
  formats: [link, text_only]
  click_weight: 0.7

threads_sport:
  platform: threads
  display_name: "Threads — Sports"
  feeds: [sport_all]
  min_gap_minutes: 30
  daily_cap: 20
  quiet_hours: ["00:00-07:00"]
  sections: [sport]
  formats: [link, photo, text_only]
  click_weight: 0.6
