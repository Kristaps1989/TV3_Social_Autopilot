<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV3 Social Autopilot</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --ink:#1a1d21; --muted:#6b7280; --line:#e5e7eb;
        --brand:#7a1fa2; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
       background:var(--bg); color:var(--ink); }
header { background:var(--brand); color:#fff; padding:.7rem 1.2rem;
         display:flex; align-items:center; gap:1.4rem; flex-wrap:wrap; }
header .logo { font-weight:700; font-size:1.05rem; }
header nav a { color:#fff; opacity:.85; text-decoration:none; margin-right:1rem; }
header nav a:hover { opacity:1; }
.badge { padding:.15rem .55rem; border-radius:99px; font-size:.78rem; font-weight:600; }
.badge.dry { background:#fef3c7; color:#92400e; }
.badge.live { background:#dcfce7; color:#166534; }
.badge.paused { background:#fee2e2; color:#991b1b; }
main { max-width:1180px; margin:1.2rem auto; padding:0 1rem; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:1rem; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px;
        padding:1rem; }
.card h2 { margin:0 0 .2rem; font-size:1rem; }
.card .meta { color:var(--muted); font-size:.82rem; margin-bottom:.6rem; }
table { width:100%; border-collapse:collapse; font-size:.86rem; }
td, th { padding:.35rem .4rem; text-align:left; vertical-align:top;
         border-top:1px solid var(--line); }
th { color:var(--muted); font-weight:600; border-top:none; }
.state { font-weight:600; font-size:.78rem; }
.state.scheduled { color:var(--warn); } .state.published { color:var(--ok); }
.state.failed, .state.cancelled { color:var(--bad); }
.copytext { color:var(--muted); max-width:420px; }
button, .btn { border:1px solid var(--line); background:#fff; border-radius:6px;
  padding:.25rem .6rem; font-size:.8rem; cursor:pointer; color:var(--ink); }
button:hover { border-color:var(--brand); color:var(--brand); }
button.danger:hover { border-color:var(--bad); color:var(--bad); }
button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
form.inline { display:inline; }
input[type=text], textarea { width:100%; border:1px solid var(--line); border-radius:6px;
  padding:.5rem .6rem; font:inherit; }
textarea.code { font:13px/1.45 ui-monospace,Menlo,Consolas,monospace; min-height:260px; }
.killbar { display:flex; align-items:center; gap:.8rem; background:var(--card);
  border:1px solid var(--line); border-radius:10px; padding:.7rem 1rem; margin-bottom:1rem; }
.killbar.on { background:#fef2f2; border-color:#fecaca; }
.notice { padding:.6rem .9rem; border-radius:8px; margin-bottom:1rem; }
.notice.ok { background:#dcfce7; color:#166534; }
.notice.err { background:#fee2e2; color:#991b1b; }
details summary { cursor:pointer; color:var(--muted); font-size:.8rem; }
code { word-break:break-all; background:var(--bg); padding:0 .25rem; border-radius:4px; }
.muted { color:var(--muted); }
h1 { font-size:1.25rem; }
</style>
</head>
<body>
<header>
  <span class="logo">TV3 Social Autopilot</span>
  <nav>
    <a href="/">Rinda</a>
    <a href="/articles">Raksti</a>
    <a href="/why">Kāpēc nav publicēts?</a>
    <a href="/stats">Statistika</a>
    <a href="/portal">Portāls</a>
    <a href="/settings">Noteikumi</a>
    <a href="/connect">Konti</a>
  </nav>
  {% block headerbadge %}{% endblock %}
  <form method="post" action="/logout" style="margin-left:auto">
    <button style="background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff">Iziet</button>
  </form>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
