services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://autopilot:${POSTGRES_PASSWORD:-autopilot}@postgres:5432/autopilot
    volumes:
      - ./rules:/srv/autopilot/rules      # editable without rebuild
      - ./prompts:/srv/autopilot/prompts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autopilot}
      POSTGRES_DB: autopilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
